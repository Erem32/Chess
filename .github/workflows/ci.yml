name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chess_test
          POSTGRES_PASSWORD: chess_test
          POSTGRES_DB: chess_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_test -d chess_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chess_test:chess_test@localhost:5432/chess_test_ci
      TEST_POSTGRES_URL: postgresql+psycopg://chess_test:chess_test@localhost:5432/chess_test_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  two-player-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chess_test
          POSTGRES_PASSWORD: chess_test
          POSTGRES_DB: chess_test_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_test -d chess_test_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chess_test:chess_test@localhost:5432/chess_test_smoke
      ENABLE_DEV_SEED_USERS: 'false'
      VITE_API_URL: http://127.0.0.1:8000
      VITE_WS_URL: ws://127.0.0.1:8000
      CHESS_E2E_ALLOW_REGISTRATION: '1'
      CHESS_E2E_FRONTEND_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run two-player browser smoke test
        run: |
          set -eu
          (cd backend && alembic upgrade head && exec uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/chess-backend.log 2>&1) &
          backend_pid=$!
          (cd frontend && exec npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/chess-frontend.log 2>&1) &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          cd frontend
          npm run test:e2e
